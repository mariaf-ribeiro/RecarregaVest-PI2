<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Desafio do Equilíbrio - RecarregaVest</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/app.js"></script>
</head>
<body>
  <!-- Tela do Figma: "Desafio equilibrio" (um desafio por dia, salvo no MySQL) -->
  <nav id="menu"></nav>
  <main class="container">
    <a class="voltar" href="inicio.html">↩ Voltar para Página inicial</a>
    <h1 class="centro">Desafio do Equilíbrio</h1>
    <p class="centro texto-suave">Uma pequena meta de bem-estar por dia.</p>

    <div class="desafio-card mt">
      <h2 id="texto">Carregando…</h2>
      <button class="btn feito mt" id="feito">Feito!</button>
      <p id="concluido" class="oculto" style="font-weight:700">✔ Desafio de hoje concluído. Volte amanhã para um novo!</p>
    </div>
    <p class="centro mt texto-suave" id="total"></p>
  </main>

  <script>
    protegerPagina("vestibulando");

    async function carregar() {
      try {
        const desafio = await api("GET", "/api/desafio/hoje");
        document.getElementById("texto").textContent = desafio.descricao;
        document.getElementById("feito").classList.toggle("oculto", desafio.concluido);
        document.getElementById("concluido").classList.toggle("oculto", !desafio.concluido);
        document.getElementById("total").textContent = `Você já concluiu ${desafio.totalConcluidos} desafio(s) no total.`;
      } catch (err) {
        avisar(err.message, true);
      }
    }

    document.getElementById("feito").onclick = async () => {
      try {
        const r = await api("POST", "/api/desafio/hoje/concluir");
        avisar(r.mensagem);
        carregar();
      } catch (err) {
        avisar(err.message, true);
      }
    };

    carregar();
  </script>
</body>
</html>
