<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rotina - RecarregaVest</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/app.js"></script>
</head>
<body>
  <!-- Telas do Figma: "Rotina sem nada" e "Rotina PREENCHIDA" (tabela atividade_rotina no MySQL) -->
  <nav id="menu" data-ativo="rotina"></nav>
  <main class="container">
    <h2 class="centro" style="font-weight:400" id="hoje"></h2>
    <p class="centro texto-suave oculto" id="vazio">Adicione atividades</p>
    <ul class="rotina mt" id="lista"></ul>

    <div style="max-width:560px;margin:24px auto 0;text-align:right">
      <button class="btn btn-salmao btn-pequeno" id="abrir">ADICIONAR</button>
    </div>

    <form class="cartao oculto" id="form" style="max-width:560px;margin:16px auto 0">
      <h3>Nova atividade</h3>
      <div style="display:flex;gap:12px">
        <div class="campo"><label for="inicio">Início</label><input type="time" id="inicio" required></div>
        <div class="campo"><label for="fim">Fim</label><input type="time" id="fim" required></div>
      </div>
      <div class="campo"><label for="descricao">O que vai fazer e onde?</label>
        <input id="descricao" maxlength="255" placeholder="Ex.: Estudar Biologia na biblioteca" required></div>
      <div style="display:flex;gap:10px;justify-content:flex-end">
        <button type="button" class="btn btn-contorno" id="cancelar">Cancelar</button>
        <button type="submit" class="btn btn-laranja">Salvar</button>
      </div>
    </form>
  </main>

  <script>
    protegerPagina("vestibulando");
    const d = new Date();
    document.getElementById("hoje").textContent = `Hoje, ${d.getDate()} de ${MESES[d.getMonth()]}`;

    async function carregar() {
      try {
        const atividades = await api("GET", "/api/rotina");
        const agora = `${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`;
        document.getElementById("vazio").classList.toggle("oculto", atividades.length > 0);
        document.getElementById("lista").innerHTML = atividades
          .map((a) => `
            <li class="${a.hora_inicio <= agora && agora < a.hora_fim ? "rotina-agora" : ""}">
              <span>${a.hora_inicio} - ${a.hora_fim} - ${escapar(a.descricao)}</span>
              <button data-id="${a.id_atividade}" aria-label="Remover">✕</button>
            </li>`)
          .join("");
        document.querySelectorAll("#lista button").forEach((b) => {
          b.onclick = async () => {
            try {
              await api("DELETE", "/api/rotina/" + b.dataset.id);
              carregar();
            } catch (err) {
              avisar(err.message, true);
            }
          };
        });
      } catch (err) {
        avisar(err.message, true);
      }
    }

    const form = document.getElementById("form");
    document.getElementById("abrir").onclick = () => { form.classList.remove("oculto"); document.getElementById("inicio").focus(); };
    document.getElementById("cancelar").onclick = () => form.classList.add("oculto");
    form.onsubmit = async (e) => {
      e.preventDefault();
      try {
        await api("POST", "/api/rotina", {
          hora_inicio: document.getElementById("inicio").value,
          hora_fim: document.getElementById("fim").value,
          descricao: document.getElementById("descricao").value
        });
        form.reset();
        form.classList.add("oculto");
        avisar("Atividade adicionada!");
        carregar();
      } catch (err) {
        avisar(err.message, true);
      }
    };

    carregar();
  </script>
</body>
</html>
