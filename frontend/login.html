<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login - RecarregaVest</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/app.js"></script>
</head>
<body>
  <!-- Telas do Figma: "Login estudante" e "Login Psicologo" -->
  <main class="container" style="padding-top:72px">
    <a class="voltar" href="index.html">↩ Voltar para o início</a>
    <form class="form-login" id="form" novalidate>
      <h2 style="font-weight:400">Bem-vindo ao RecarregaVest!</h2>
      <p>Faça seu login:</p>

      <div class="alternador">
        <span>Sou</span>
        <span class="opcoes">
          <button type="button" data-perfil="estudante" class="ativo">Estudante</button>
          <button type="button" data-perfil="psicologo">Psicólogo</button>
        </span>
      </div>

      <div class="campo" id="campo-email">
        <input type="email" id="email" placeholder="Email" autocomplete="username">
      </div>
      <div class="campo oculto" id="campo-crp">
        <input type="text" id="crp" placeholder="CRP (ex.: 05/10001)">
      </div>
      <div class="campo senha-wrap">
        <input type="password" id="senha" placeholder="Senha" autocomplete="current-password">
        <button type="button" aria-label="Mostrar senha">👁</button>
      </div>

      <div id="erro" class="aviso aviso-erro oculto"></div>

      <button class="btn btn-bloco mt" type="submit">Entrar</button>
      <div class="separador">Ou</div>
      <a class="btn btn-claro btn-bloco" id="criar" href="cadastro.html">Criar uma conta</a>
    </form>
  </main>

  <script>
    let perfil = new URLSearchParams(location.search).get("perfil") === "psicologo" ? "psicologo" : "estudante";

    function trocarPerfil(novo) {
      perfil = novo;
      document.querySelectorAll(".alternador button").forEach((b) => b.classList.toggle("ativo", b.dataset.perfil === novo));
      document.getElementById("campo-email").classList.toggle("oculto", novo === "psicologo");
      document.getElementById("campo-crp").classList.toggle("oculto", novo !== "psicologo");
      document.getElementById("criar").href = "cadastro.html?perfil=" + (novo === "psicologo" ? "psicologo" : "estudante");
    }
    document.querySelectorAll(".alternador button").forEach((b) => (b.onclick = () => trocarPerfil(b.dataset.perfil)));
    trocarPerfil(perfil);
    ligarOlhoSenha();

    document.getElementById("form").onsubmit = async (e) => {
      e.preventDefault();
      const erro = document.getElementById("erro");
      erro.classList.add("oculto");
      const botao = e.target.querySelector("[type=submit]");
      botao.disabled = true;
      try {
        const { token, usuario } = await api("POST", "/api/auth/login", {
          perfil,
          email: document.getElementById("email").value,
          crp: document.getElementById("crp").value,
          senha: document.getElementById("senha").value
        });
        RV.salvarLogin(token, usuario);
        window.location.href = paginaInicial(usuario.tipo_perfil);
      } catch (err) {
        erro.textContent = err.message;
        erro.classList.remove("oculto");
      } finally {
        botao.disabled = false;
      }
    };
  </script>
</body>
</html>
